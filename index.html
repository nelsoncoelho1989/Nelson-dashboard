<style>
:root{
--bg:#07090F; --card:#0D1118; --card2:#131927; --border:#1C2438;

*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;margin:0;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px 10px;position:sticky;top:0;z-index:20;}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.eyebrow{color:var(--sub);font-size:8px;letter-spacing:3px;text-transform:uppercase;}
.name{font-size:17px;font-weight:800;letter-spacing:-0.5px;}
.badge{background:#22C55E22;border:1px solid #22C55E55;color:var(--z1);border-radius:5px;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:1px;white-space:nowrap;}
.sync{font-size:8px;color:var(--sub);letter-spacing:1px;text-align:right;margin-top:4px;}
.refreshBtn{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:5px;padding:3px 8px;font-size:10px;cursor:pointer;margin-top:4px;}
.refreshBtn:active{color:var(--orange);border-color:var(--orange);}
.tabs{display:flex;gap:6px;}
.tab{background:transparent;border:1px solid var(--border);color:var(--sub);border-radius:6px;padding:4px 12px;font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;}
.tab.active{background:#FF542220;border-color:var(--orange);color:var(--orange);}
.content{padding:16px 14px 48px;}
.pane{display:none;}
.pane.active{display:block;}
.st{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.st .bar{width:3px;height:14px;border-radius:2px;}
.st .label{color:var(--sub);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:16px;}
.card2{background:var(--card2);border-radius:8px;padding:8px 10px;}
.metrics-row{display:flex;gap:8px;margin-bottom:8px;}
.metric{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;flex:1;min-width:0;}
.metric .mlabel{color:var(--sub);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px;}
.metric .mval{font-size:22px;font-weight:800;font-family:monospace;line-height:1;}
.metric .munit{color:var(--sub);font-size:10px;margin-left:3px;}
.metric .msub{color:var(--sub);font-size:9px;margin-top:3px;}
.metric .mtrend{font-size:10px;margin-top:2px;}
.gauge-wrap{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px 6px 10px;margin-bottom:18px;}
.gauge-legend{display:flex;justify-content:space-around;padding-top:6px;}
.gauge-legend div{text-align:center;}
.gauge-legend .gv{font-size:11px;font-weight:800;font-family:monospace;}
.gauge-legend .gl{color:var(--sub);font-size:8px;letter-spacing:1px;}
.zonebar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.zonebar-z{font-size:10px;font-weight:800;width:22px;flex-shrink:0;}
.zonebar-track{background:var(--border);border-radius:3px;height:6px;}
.zonebar-fill{height:100%;border-radius:3px;}
.session-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);}
.session-row:last-child{border-bottom:none;}
.session-row.planned{opacity:.55;}
.session-row.today{background:#FF542208;}
.sday{color:var(--sub);font-size:9px;width:38px;flex-shrink:0;}
.sdot{width:9px;height:9px;border-radius:50%;margin-right:10px;flex-shrink:0;}
.scode{font-size:12px;}
.skm{color:var(--sub);font-size:10px;font-family:monospace;margin-right:8px;}
.stag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;}
.race-row{padding:12px 14px;border-bottom:1px solid var(--border);}
.race-row:last-child{border-bottom:none;}
.race-top{display:flex;justify-content:space-between;align-items:flex-start;}
.race-prio{color:var(--sub);font-size:8px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px;}
.race-name{font-size:13px;font-weight:600;}
.race-dist{color:var(--sub);font-size:10px;}
.race-date{font-size:12px;font-weight:700;font-family:monospace;text-align:right;}
.race-days{color:var(--sub);font-size:9px;text-align:right;}
.calib-row{padding:10px 14px;border-bottom:1px solid var(--border);}
.calib-row:last-child{border-bottom:none;}
.calib-top{display:flex;justify-content:space-between;margin-bottom:5px;}
.calib-session{color:var(--orange);font-size:11px;font-weight:700;}
.calib-date{color:var(--sub);font-size:9px;}
.calib-cols{display:flex;gap:12px;}
.calib-col-label{color:var(--sub);font-size:8px;letter-spacing:1px;}
.calib-col-val{color:var(--text);font-size:11px;font-family:monospace;}
.calib-read{color:var(--z1);font-size:10px;}
.phase-item{display:flex;gap:10px;align-items:flex-start;}
.phase-dot-col{display:flex;flex-direction:column;align-items:center;}
.phase-dot{width:10px;height:10px;border-radius:50%;margin-top:3px;flex-shrink:0;}
.phase-line{width:1.5px;height:22px;background:var(--border);margin-top:3px;}
.phase-label{font-size:11px;}
.phase-sub{color:var(--sub);font-size:9px;}
.footer{text-align:center;color:var(--dim);font-size:8px;letter-spacing:1.5px;margin-top:20px;text-transform:uppercase;}
.note{background:var(--card2);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:10px;color:var(--sub);line-height:1.5;}
.note b{color:var(--orange);}
</style>
</head>

{ date:"13 Ago", session:"HILL-4xCOMPLETA+2xB", pace:"9,0km · D+177m · potência 612-646W", fc:"máx 168", read:"Execução perfeita: cadência ≥89spm em todas as reps, nunca abaixo do alvo (85spm). 4ª rampa (simula km9 do Tejo em fadiga) teve a melhor cadência das quatro (93,5spm) — sem degradação técnica sob fadiga" },
{ date:"15 Ago", session:"CAVALARICAS 6x21''", pace:"5,02km · D+116m · potência 688-775W", fc:"máx 160", read:"Estreia excelente: cadência 100-110spm em todas as reps — muito acima do défice crónico de 80-84spm em corrida normal. Sem degradação nas últimas reps. Boa base para progressão a 8 reps em 22 Ago" },
{ date:"16 Ago", session:"LR17 progressivo", pace:"17,02km · 4:48/km médio · fecho 4:35-4:41/km", fc:"127→170 (negative split)", read:"Execução exemplar do método: 1ª metade em zona, 2ª acelera progressivamente sem degradação. Semana 33 fecha em 70,7km. ANAEROBIC_SHORTAGE sinalizado pelo Garmin — relevante para o 6x1000 de terça" },
{ date:"18 Ago", session:"6x1000 (feito)", pace:"3:49/3:50/3:50/3:48/3:48/3:46/km — mais rápido que o alvo, acelerando", fc:"154→158→160→167→165→164 (máx 171)", read:"CALIBRAÇÃO CONFIRMADA: FC estabilizou nas últimas 2 reps mesmo com o ritmo a continuar a melhorar — sem disparar. Teto real ~3:46-3:48/km, mais rápido que o alvo de 3:50-3:55. 01 Set sobe para 10K-5x1K-FORTE (3:50-3:55/km). VDOT 54-55 fica como referência, a confirmar antes de mudar a tabela oficial." },
{ date:"25 Ago", session:"3x2000 (feito)", pace:"3:50/3:48/3:42/km — negative split, todos abaixo do alvo (3:56-4:00)", fc:"160,6→161,1→163,4 (máx 175, só nos últimos 20m)", read:"Pista do Real, HRV 56ms de manhã (bem recuperado). FC quase plana apesar do ritmo a descer 8s/km — economia real, não adrenalina. Terceira sessão seguida com este padrão (5x1000, 6x1000 18Ago, agora 3x2000). O FORTE de 1/Set (3:50-3:55) já pode estar conservador — Qui (I-400x8) é o próximo ponto de confirmação antes de mexer no alvo." },
{ date:"27 Ago", session:"I-400x8 (feito)", pace:"3:25/3:22/3:20/3:20/3:15/3:15/3:02/km — reps 2-8 (rep1 disparou, alerta não estava configurado)", fc:"146→150→149→152→156→155→158 (máx 158 no rep mais rápido)", read:"4ª sessão consecutiva com FC atrás do ritmo (5x1000, 6x1000, 3x2000, agora I-400x8). Regra pré-decidida acionada: 01/Set 10K-5x1K sobe de FORTE (3:50-3:55) para 3:44-3:48/km. Rep1 saiu rápido por o alerta não estar configurado — checklist pré-treino de pista atualizado." },
{ date:"29 Ago", session:"REC35-DRILL (feito)", pace:"6,68km em 35:25 (5:18/km) — splits 5:49→5:10/km", fc:"123→147 (máx 153, só nos últimos ~100m)", read:"Sessão de recuperação verdadeira, não calibração. HR dentro do teto Z2 completo (133-147) apesar do D+92m no Parque de Queluz. Sem sinais de fadiga acumulada antes do longo de domingo." },
{ date:"01 Set", session:"10K-5x1K (feito)", pace:"3:44/3:38/3:35/3:37/3:33/km — negative split completo, só a 1ª rep no alvo", fc:"153→155→159→159→161 (máx 165→168→172→169→172)", read:"Pista do Real, execução limpa — sem arranque disparado, alerta de pace funcionou. 5ª sessão consecutiva com FC atrás do ritmo. Teto de FC estável ~172 nas últimas 3 sessões a ritmos diferentes — sinal forte de patamar real, não ruído. Alvo de 3:44-3:48 (decidido há só 4 dias) já ficou conservador na 1ª confirmação. VDOT estimado sobe para 55-56. Último específico sério antes do Tejo — não repetir teste, deixar a afinação atuar." },
{ date:"02 Set", session:"EASY+STR (feito)", pace:"8,96km em 50:59 (5:41/km)", fc:"113→139 (máx 153, terreno)", read:"Sessão fácil verdadeira, sem sinais de fadiga acumulada pós-10K-5x1K. Estrutura completa cumprida — base + strides bem definidos." },
{ date:"03 Set", session:"SHARP-6x300 (feito)", pace:"58/56/55/55/52/49s (2:43-3:13/km)", fc:"média 130, máx 163", read:"Pista do Real. FC baixa o tempo todo, longe do teto de 172 — sessão neuromuscular, não aeróbia. Cadência 94-103spm nas séries. Sessão de afiar cumprida sem stress cardiovascular." },
{ date:"04 Set", session:"EASY40 (feito)", pace:"7,60km em 40:10 (5:17/km)", fc:"119→150 (máx 155, terreno)", read:"Última fácil antes do pacer de sábado. FC dentro do razoável, subida explicada pelo terreno (D+73m). Sem sinais de fadiga acumulada." },
{ date:"05 Set", session:"PACER-CAPARICA (feito)", pace:"10,2km em 50:31 (4:57/km) — pacing quase perfeito", fc:"km1 asfalto 139,8 · km2-9 areia 160-172 · final asfalto 159", read:"Maré alta, ziguezague para evitar ondas, areal instável. Esforço relativo 137. Splits por piso confirmam o mecanismo: FC seguiu o terreno, não o ritmo — 50min a esforço de limiar/VO2max pela instabilidade. Estímulo grande e não planeado a 8 dias do Tejo. Motivou ajuste do domingo." },
{ date:"06 Set", session:"SHAKEOUT (feito)", pace:"7,22km em 40:03 (5:33/km)", fc:"média 135,5/máx 149", read:"Substituiu o LR12-SOFT original. Sem sinais de fadiga residual do pacer apesar de D+101m. Semana 36 fechada em 59,27km (91,9% do alvo 64,5km) — decisão de priorizar recuperação sobre volume nos últimos 2 dias validada pelos dados." },
{ date:"08 Set", session:"10K-3x1K+200 (feito, não como prescrito)", pace:"1000m: 3:44/3:46/3:42/km · 200m: 33/33/31/30s", fc:"1000m 154,7→156,2→157,7 (máx 171→164→164)", read:"Sessão era modo CUMPRIR ('fresco, não cansado'), saiu como teste: 1000m 10-18s/km mais rápido que o alvo, 200m em sprint a sério (vel. máx 7,5m/s). FC continua abaixo do piso da zona mesmo mais rápido — 6ª+ sessão consecutiva com este padrão, sinal real de patamar a subir. Mas a 5 dias do Tejo isto é custo de fadiga sem tempo de adaptação — não é o momento para mais confirmações. Vigiar HRV/RHR nos próximos 1-2 dias." },
{ date:"13 Set", session:"Corrida do Tejo (prova)", pace:"10,06km · 40:13 · splits 3:54/3:51/4:07/3:44/3:46/3:57/4:07/4:18/4:13/4:05", fc:"média 164/máx 178 · 68% do tempo em Z5", read:"Diploma oficial (14Set): chip 40:13 (=Garmin), bruto 40:26, 198º geral, 35º M35, km5 oficial 19:35 (2ª metade 20:38 → positive split real 1:03, mais curto que a estimativa Garmin de 1:18). Checkpoints de FC (150-155/160-163bpm) ultrapassados desde o km3, mas o ecrã não mostrava BPM — impossível monitorizar em tempo real. Pior km foi o 8º (plano), não a subida. Calor forte + queda de FC no km9-10 coincide com pórtico de água. vs 2025: -2:28 com FC mais baixa. vs 2019 (mesmo perfil, 38:34): 1:39 mais lento, mas 2019 teve pacing quase perfeito (FC monótona, cadência estável) — gap é tático, não físico. VDOT sobe cautelosamente para 54 (oficial); 55-56 fica por confirmar. Loures (20Set) e Bimbo (27Set) são pacer submáximo — não validam. Entre Bimbo e a Vasco da Gama (11Out) há só o fim de semana de 3-4Out livre, insuficiente para um teste máximo sem comprometer o taper da meia. Confirmação real fica para a Volkswagen Run (25Out, prova própria, já recuperado da meia)." },
{ date:"16 Set", session:"Recalibração VDOT53→VDOT54 (biblioteca Garmin)", pace:"T-LIM (rua) 4:03-4:07/km · T-LIM-PISTA 3:59-4:04/km · I-400 1:29-1:32/400m · SHARP-300 64-67s · 10K-6x1K/2x3K1K/4x1500 também", fc:"—", read:"Toda a biblioteca de qualidade no relógio recalibrada para VDOT54, confirmado pelo Tejo, incluindo templates que tinham ficado esquecidos numa primeira passagem (TEMPO25, LR2x10T, 10K-6x1K, 10K-2x3K1K, 10K-4x1500). Corrida Auchan removida de vez. Plano de Out (semanas 40-43) escrito no Excel e no relógio: sem taper de semana inteira para a Volkswagen (regra nova — provas de 10km ou menos só levam shakeout no dia anterior)." },
{ date:"20 Set", session:"Meia Loures-Odivelas-Loures (pacer 4:30 · feita)", pace:"21,14km · 1:34:27 (Garmin) · 4:28/km · km entre 4:22 e 4:34, km21 a 4:16 · oficial: chip 1:34:28 (final 1:34:38) · 149.º geral · 26.º escalão", fc:"média 165/máx 179 · km1 143 → km2-8 157-162 → km13-16 169 → km19-21 173-176 · desacoplamento ~6% (potência ~420W constante)", read:"Pacing limpo (km 2-20 a 4:28,7, desvio ~3s), split negativo (4:29→4:28); km 20+21 somam 4:25 (4:34/4:16 = provável artefacto de marcação, potência 414/422W), sprint real só nos últimos 137m. Chip 29s abaixo dos 1:34:57 que 4:30 fixos dariam em 21,0975km (o Garmin, 21,14km, confirma percurso de ~21,1km e não 21,5). FC muito acima do esperado para 4:28: a média iguala o LTHR (165) e é igual à do Tejo a 4:00 (164); TE 5.0, carga 538, 93min vigorosos — mas esforço percebido 6/10 e sensação 'muito forte'. Partida com contexto fraco: sono de 4h45 (score 60) e 5h54 na noite anterior, Body Battery a 52% ao acordar (vs ~90 na véspera), RHR 50 (+3 vs 47), readiness 58; HRV balanced (50-52) e ACWR 1,1 normais. Calor forte segundo o Nelson (o Garmin só tem a leitura das 9h no aeroporto — 21°C, 60% humidade — e a prova acabou às 10h36); abastecimentos da organização em copos (pouco úteis); levou flask de 250ml com Powerade (+250ml da garrafa 25min antes da partida) e géis (SIS aos ~35min, PowerBar no km 14) — combustível razoável; líquido em prova só ~250ml do flask (~160ml/h) + copos, provável défice de hidratação com calor. Pós-meia: readiness 2, recuperação 91,9h (até ~24 Set de manhã). Leitura em aberto: não dá para separar défice de resistência aos 90min de ruído de contexto (sono curto, calor e hidratação limitada, adrenalina de pacer, mochila, cafeína, sensor de pulso). Meta 1:30-1:31 da Vasco da Gama (4:16-4:18/km) não fica validada nem desmentida — decisão por tomar." },
{ date:"22 Set", session:"EASY+STR (feito)", pace:"8,19km em 52:09 (6:23/km, splits 6:51→6:01/km)", fc:"média 123/máx 148 (pico nos strides)", read:"Primeira sessão da semana 39, dia seguinte ao pacer de Loures. Ritmo e FC bem abaixo do alvo (Z1, não Z2) — treino acompanhado, não fadiga: nas subidas do percurso (Cavalariças, Mata) a FC não disparou, sinal de zero resíduo muscular do domingo (relatado pelo próprio Nelson e consistente com os dados). Strides limpos, sem excesso. Ponto de atenção para a frente: este padrão de deixar o parceiro ditar o ritmo é aceitável em dia FÁCIL/RECUPERAÇÃO — não pode infiltrar-se no T-LIM de quinta nem no específico." },
{ date:"24 Set", session:"T-LIM-3x8-PISTA (feito)", pace:"3x8min a ~3:52-3:56/km (alvo pista 3:59-4:04) · 3º bloco a acelerar até ~3:45/km", fc:"blocos fecham em 161 / 164 / 168 (LTHR 165)", read:"4-12s/km mais rápido que o alvo com FC no LTHR — a FC no limiar está ~12s/km melhor que o 4:05@165 do perfil Garmin. Em rua vale ~3:56-3:58. 7ª sessão com FC atrás do ritmo, reforça VDOT 55-56 (por confirmar em prova). Custo real: recovery_time subiu para ~67h. Para T-LIM em rua na S40 mantém-se o alvo 4:03-4:07 em modo CUMPRIR." },
{ date:"27 Set", session:"Pacer Bimbo Global Race (feito)", pace:"9,96km em 49:16 · 4:57/km médio (alvo 5:00, ~3s/km mais rápido)", fc:"média 151 · 144→159, só 164 no fecho", read:"Pacing limpo, sem arranque disparado. Total do dia 16,26km com aquecimento (3,59km) e arrefecimento (2,71km). Sem custo de fadiga visível: HRV 57ms e RHR 45 na manhã seguinte." },
{ date:"28 Set", session:"EASY45 (feito)", pace:"8,25km em 45:02 · 5:27/km", fc:"média 132", read:"Dia seguinte ao pacer: fácil de verdade, sem progressivo escondido. Estado da manhã: HRV 57, RHR 45, sono 94, readiness 60 (57 pós-treino), ACWR 1.0. Fadiga real baixa; o recovery_time (~41h) é reflexo dos 16,3km, não sinal autónomo." },
{ date:"29 Set", session:"T-LIM-4x6-PISTA (feito)", pace:"4 blocos de 6min: 3:49 / 3:54 / 3:51 / 3:43/km (alvo pista 3:56-3:59)", fc:"165 / 159 / 160 / 163 bpm (LTHR 165, alerta de excesso 166)", read:"8ª sessão de qualidade seguida mais rápida que o prescrito — já não é um desvio pontual, é o padrão. O 1º bloco já cruzou o critério de excesso definido (abaixo de 3:54/km) e o 4º fechou a 3:43, quase 15s/km abaixo do alvo. A FC ficou sempre controlada e a técnica melhorou a acelerar (cadência 177→185, contacto no solo a descer), o que sugere capacidade aeróbia real e não apenas adrenalina — mas a disciplina de ritmo em modo CUMPRIR continua a falhar. A 6 dias da prova da Amadora e a 12 da Vasco da Gama, mais uma sessão de limiar acima do prescrito é carga extra que não estava orçamentada." },
{ date:"01 Out", session:"TEMPO25 (feito)", pace:"média 4:04/km (alvo), mas km a km: 4:12,5 / 4:09,9 / 4:02,9 / 4:01,9 / 3:56,8 / 3:58,9 (km6 a subir)", fc:"145→163bpm progressivo, máx168, 70s em Z5 no fecho (alvo 162-166)", read:"A média no alvo escondeu uma estrutura em V: 2km mais lentos, 1 no alvo, 3 mais rápidos com o último a subir — esforço empurrado, não só terreno. É o mesmo padrão comportamental de terça (fecho mais forte que o prescrito), só que em contínuo. Última qualidade antes da Amadora (5 Out), 4 dias de distância." },
{ date:"02-04 Out", session:"EASY40 + Lisboa Corrida + EASY30 (feitos)", pace:"2 Out 7,42km 5:24/km · 3 Out 10,02km em 54:27 (5:26/km) · 4 Out 5,54km 5:26/km", fc:"131 / 134 / 134 médias (máx 145-148)", read:"Três dias fáceis de verdade, sem progressivo: FC sempre em Z1-Z2, ritmo no limite lento do alvo. O longo de sábado ficou em 10,02km (plano original: LR14,5). Semana 40 fecha em 60,95km (92% do alvo 66km)." },
{ date:"05 Out", session:"Brandoa 10K (prova · ESPECÍFICO)", pace:"9,65km em 39:27 · 4:05/km · 3:42/3:54/3:56/3:40/4:33/4:05/4:10/4:11/4:04 + 654m a 4:53", fc:"média 169/máx 178 · 149→166→169→168→173→170→171→173→171→175", read:"Modo ESPECÍFICO (não teste). Distância certa confirmada (9,65km). Resultado melhor que os 40:15-40:45 esperados, mas por um caminho que o plano pedia para evitar: km1 a 3:42 (descida) e km4 a 3:40 (descida) pagos com km5 a 4:33 (subida, FC 173) e a segunda metade 17s/km mais lenta (4:14 vs 3:57). FC média 169 vs 164 no Tejo — esforço alto. Não conta como teste de VDOT (esse é a Volkswagen, 25 Out). Sensação: pernas bem; Nelson quer incluir força de subida no plano pós-Vasco da Gama." },
{ date:"06 Out", session:"EASY+STR (feito)", pace:"8,28km em 51:05 (6:10/km)", fc:"média 124 / máx 145", read:"Dia seguinte à prova, fácil de verdade em Z1. Sem fadiga muscular residual relatada." },
{ date:"07 Out", session:"EASY30 (feito, progressivo escondido)", pace:"6,19km em 30:04 (4:51/km) · 5:26/4:57/4:48/4:50/4:42/4:29 + fecho ~4:21/km", fc:"média 140 / máx 164 · 119→134→140→146→147→157→161", read:"Treino FÁCIL que acabou em Z4. A média de FC (140) engana: o começo lento escondeu um fecho a 4:21/km e 161-164 bpm. Repete o padrão de fecho acima do prescrito de 29 Set e 1 Out, agora num dia em modo FÁCIL e não só em qualidade. A 3 dias do pacer e 4 da meia, é carga extra sem objetivo. Na sexta (EASY30, teto 140 bpm) tem de ser fácil de verdade." },
{ date:"08 Out", session:"SHARP-4x1 (feito)", pace:"4 reps de 1min a ~3:20/3:01/3:07/3:01 por km (300-330m) · aquec. 3,02km, arref. 1,35km", fc:"máx por rep 157/148/158/150 · média das reps 117-142", read:"Sessão neuromuscular limpa, sem stress cardiovascular e com recuperações cumpridas. Readiness: 68-69 ao acordar, 41 após a sessão, 50 ao fim do dia; HRV 50 (baseline), RHR 45, ACWR 0,9. Critérios de quinta cumpridos; sem sinal de fadiga acumulada preocupante, mas sono curto (6h16) continua a ser o ponto fraco antes de sáb+dom." },
{ date:"09 Out", session:"EASY30 (feito)", pace:"5,16km em 30:00 · 5:49/km", fc:"média 130 (vs 140 no EASY30 de 7 Out)", read:"Fácil de verdade desta vez: FC média 10bpm abaixo da de quarta e abaixo do teto de 140. Splits não analisados. Cumpre o critério definido na quarta para a véspera do pacer." },
{ date:"10 Out", session:"Pacer Maratona 4h45, 2ª metade (feito)", pace:"21,15km em 2:17:58 · 6:31/km (referência 6:45, -14 s/km) · km entre 6:23 e 6:46, último km a 6:06 · só 4 de 21 km a ±3 s de 6:45", fc:"média 133 · 129-135 por km · máx 148 (sprint final) · sem deriva (km1-5 ~133, km16-20 ~132) · potência ~304 W estável", read:"Nelson recebeu o grupo já a ~6:31 e geriu-o: o desvio vs 6:45 é herdado da 1ª metade, não é erro de pacing dele (correção dele, 10 Out). Fisiologicamente limpo: teto de FC 135 cumprido, zero deriva em 2h18, cadência 159→171, RPE 2/10, TE 3,5 aeróbio, carga 138. Estado na manhã: HRV 53 BALANCED, RHR 45, sono 6h38 (score 79); readiness 78 → 59 pós-pacer, recovery_time 25,3h, ACWR 0,8. Marcador de economia aeróbia positivo (133 bpm a 6:31 sem deriva) mas não valida VDOT — pacer submáximo. Risco para a meia de domingo: glicogénio/pernas e sono, não sistema autónomo." },

function renderVDOTGauge(vdot, vdotEst){
const W=320,H=200,cx=160,cy=175,Ro=126,Ri=96,VMIN=48,VMAX=63;
const vToAngle = v => Math.PI*(1-(v-VMIN)/(VMAX-VMIN));
const ptAt=(v,r)=>{ const a=vToAngle(v); return [ (cx+r*Math.cos(a)).toFixed(2), (cy-r*Math.sin(a)).toFixed(2) ]; };
const arc=(v1,v2,R)=>{ const [x1,y1]=ptAt(v1,R),[x2,y2]=ptAt(v2,R); const large=Math.abs(vToAngle(v2)-vToAngle(v1))>Math.PI?1:0; return `M ${x1} ${y1} A ${R} ${R} 0 ${large} 1 ${x2} ${y2}`; };
const estEnd = parseFloat((vdotEst||"").split("–")[1] || (vdot+1.5));
const [nx,ny]=ptAt(vdot,Ri+6), [nx2,ny2]=ptAt(vdot,Ro+5);
const ticks=[48,51,53,55,57,60,63].map(v=>{
const [tx,ty]=ptAt(v,Ri-14),[t1x,t1y]=ptAt(v,Ri),[t2x,t2y]=ptAt(v,Ri-6);
return `<line x1="${t1x}" y1="${t1y}" x2="${t2x}" y2="${t2y}" stroke="var(--sub)" stroke-width="1.5"/><text x="${tx}" y="${parseFloat(ty)+3}" text-anchor="middle" fill="var(--sub)" font-size="8" font-family="monospace">${v}</text>`;
}).join("");
return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
<path d="${arc(VMIN,VMAX,Ro)}" fill="none" stroke="var(--dim)" stroke-width="20" stroke-linecap="round"/>
<path d="${arc(48,51.3,Ro)}" fill="none" stroke="var(--sub)" stroke-width="20" opacity="0.15"/>
<path d="${arc(51.3,53,Ro)}" fill="none" stroke="var(--z3)" stroke-width="20" opacity="0.2"/>
<path d="${arc(53,55,Ro)}" fill="none" stroke="var(--orange)" stroke-width="20" opacity="0.18"/>
<path d="${arc(55,57,Ro)}" fill="none" stroke="var(--purple)" stroke-width="20" opacity="0.18"/>
<path d="${arc(57,63,Ro)}" fill="none" stroke="var(--teal)" stroke-width="20" opacity="0.18"/>
<path d="${arc(VMIN,vdot,Ro)}" fill="none" stroke="var(--orange)" stroke-width="20" stroke-linecap="round"/>
<path d="${arc(vdot,estEnd,Ro)}" fill="none" stroke="var(--orange)" stroke-width="20" stroke-dasharray="6 5" opacity="0.55"/>
<path d="${arc(VMIN,VMAX,Ri)}" fill="none" stroke="var(--border)" stroke-width="2" stroke-linecap="round"/>
${ticks}
<line x1="${nx}" y1="${ny}" x2="${nx2}" y2="${ny2}" stroke="var(--orange)" stroke-width="3" stroke-linecap="round"/>
<circle cx="${nx}" cy="${ny}" r="4" fill="var(--orange)"/>
<text x="${cx}" y="${cy-52}" text-anchor="middle" fill="var(--text)" font-size="54" font-weight="900" font-family="'Courier New',monospace" letter-spacing="-2">${vdot}</text>
<text x="${cx}" y="${cy-32}" text-anchor="middle" fill="var(--sub)" font-size="9" letter-spacing="3">VDOT OFICIAL</text>
<text x="${cx}" y="${cy-12}" text-anchor="middle" fill="var(--orange)" font-size="13" font-weight="600">~${vdotEst} estimado</text>
</svg>`;
}
function renderRaceTrendChart(data, vdotCur){
const W=300,H=140,padL=26,padR=10,padT=10,padB=18;
const vmin=50, vmax=57;
const xAt = i => padL + (W-padL-padR) * (i/(data.length-1));
const yAt = v => padT + (H-padT-padB) * (1 - (v-vmin)/(vmax-vmin));
const pts = data.map((d,i)=>`${xAt(i)},${yAt(d.vdot)}`).join(" ");
const dots = data.map((d,i)=>`<circle cx="${xAt(i)}" cy="${yAt(d.vdot)}" r="4" fill="var(--orange)"/>`).join("");
const labels = data.map((d,i)=>`<text x="${xAt(i)}" y="${H-4}" text-anchor="middle" fill="var(--sub)" font-size="8">${d.x}</text>`).join("");
return `<svg viewBox="0 0 ${W} ${H}" width="100%">
<line x1="${padL}" y1="${yAt(vdotCur)}" x2="${W-padR}" y2="${yAt(vdotCur)}" stroke="var(--orange)" stroke-dasharray="4 3" stroke-width="1"/>
<polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2.5"/>
${dots}${labels}
</svg>`;
}

<div class="note" style="margin:0;border-radius:0 0 12px 12px"><b>Semana 42 — RECUPERAÇÃO PÓS-MEIA</b>. Seg 12 descanso total. Ter 13 EASY40 em Sintra: 7,69km em 40:12 (5:14/km), FC média 140/máx 159, saiu progressivo (últimos ~2,6km em Z3, Garmin TEMPO, carga 131) apesar de percebido 3/10. Qua 14 EASY STR em Sintra: 8,93km em 51:01, FC 127-136 (máx 145 no corpo do treino), teto de 147 cumprido, 6 strides progressivos até ~3:01/km, eficiência igual à de terça (~0,0225 vs 0,0228 m/s/bpm). Fadiga real baixa e só autónoma: HRV 44 (2.ª noite abaixo de 45 em 3) e RHR 50 (a subir 48→49→50) = resíduo da meia, sem sinal muscular; ACWR 0,9, TSB +54. Qui 15 EASY STR (reagendado no relógio a 14 Out; sem strides se HRV <42 ou RHR ≥52), Sex 16 EASY40, Sáb 17 REC35-DRILL, Dom 18 Torneio de 10 km competitivo (conta como sessão forte, 7 dias antes da Volkswagen; critério de manhã proposto: HRV ≥47 e RHR ≤49 → plano completo, HRV <45 ou RHR ≥52 → sub-40 sai como alvo); Ter 20 3x2km a 3:58-4:02 (ensaio, não teste máximo), Qui 22 SHARP-4x1, Dom 25 Volkswagen Run. A S41 fechou em 77,6km (pacer 21 + meia 21,25).</div>
</div>
